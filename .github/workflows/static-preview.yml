# Quota-free second address: a static copy of main on GitHub Pages, https://anat1969.github.io/-95/
# The job turns Pages on by itself (configure-pages, enablement), so nobody has to open the repo settings.
# Image upload (app/api) needs a server, so it is left out of this copy; the built-in images are kept.
name: static preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: rm -rf app/api
      - run: npm run build
        env:
          STATIC_EXPORT: '1'
          BASE_PATH: /-95
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
